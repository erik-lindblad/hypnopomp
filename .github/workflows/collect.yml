name: collect-dreams

# Stage 1 deployment: a scheduled GitHub Actions job runs the headless collector
# for a short bounded window, then commits the accumulated corpus back to this
# PRIVATE repo. The window is sized to fit GitHub's free 2,000 Actions-min/month
# so nightly collection stays free on a private repo — see the README budget math.

on:
  workflow_dispatch:
    inputs:
      duration_ms:
        description: "How long to listen, in ms (manual runs)"
        default: "300000"   # 5 minutes — good for a quick test
  schedule:
    # 12:00 UTC daily → the collector listens ~50 min (a short window sized to fit
    # the free 2,000 Actions-min/month budget; see the README). 12:00 UTC is the
    # densest single hour of US dream-posting — it overlaps the post-wake window
    # of the two largest zones:
    #   Eastern  8:00–8:50am
    #   Central  7:00–7:50am
    # — together ~¾ of the US. Being short, it samples this peak hour rather than
    # the whole coast-to-coast morning the old 5.5h window swept. (For nightly
    # full-length collection, going public unlocks unlimited minutes — see README.)
    # Cron is always UTC, so this drifts an hour earlier in local terms after Nov.
    - cron: "0 12 * * *"

# Never run two collectors at once (they'd fight over corpus.json on commit).
concurrency:
  group: collect-dreams
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the corpus back

jobs:
  collect:
    runs-on: ubuntu-latest
    # ~50-min collect + setup/commit; 60 is a safe ceiling.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Collect
        env:
          OUTPUT: data/corpus.json
          # Manual runs use the input; scheduled runs listen ~50 min (3,000,000 ms).
          DURATION_MS: ${{ github.event.inputs.duration_ms || '3000000' }}
        run: node collector.js

      - name: Commit corpus
        run: |
          git config user.name "dreaming-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/corpus.json
          if git diff --cached --quiet; then
            echo "no new dreams this run"
          else
            COUNT=$(node -e "console.log(require('./data/corpus.json').length)")
            git commit -m "[skip ci] corpus: ${COUNT} dreams"
            git push
          fi
